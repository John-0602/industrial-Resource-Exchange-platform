services:
  # Microservice 1: Resource Service
  - type: web
    name: resource-service
    runtime: node
    rootDir: resource-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: EXCHANGE_SERVICE_URL
        fromService:
          type: web
          name: exchange-service
          property: host

  # Microservice 2: Exchange Service
  - type: web
    name: exchange-service
    runtime: node
    rootDir: exchange-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: resource-service
          envVarKey: JWT_SECRET
      - key: RESOURCE_SERVICE_URL
        fromService:
          type: web
          name: resource-service
          property: host
      - key: SERVICE_API_KEY
        fromService:
          type: web
          name: resource-service
          envVarKey: SERVICE_API_KEY
      - key: CLIENT_ORIGIN
        value: "*"

  # Frontend Web Client (Static Single Page App)
  - type: web
    name: irep-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_RESOURCE_SERVICE_URL
        fromService:
          type: web
          name: resource-service
          property: host
      - key: VITE_EXCHANGE_SERVICE_URL
        fromService:
          type: web
          name: exchange-service
          property: host
